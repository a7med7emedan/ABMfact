# Gate 4: the Gate 3 comparison of drug pulse, unchanged except for fresh seeds and the T2 gains.
# Written and committed before any Gate 4 run; see PROTOCOL.md.
title: "Gate 4, problem 5: drug pulse, T2 translation"
model: ../../examples/ir/drug_pulse.yaml
engines: [reference, physicell, compucell3d, morpheus]
baseline: reference
seeds: 20
jobs: 10
options_from:                      # the calibrated gains; every other setting is Gate 3's, frozen in cc69375
  compucell3d: [results/calibration/pressure_compucell3d/translation.json,
                results/calibration/motility_compucell3d/translation.json]
  morpheus: [results/calibration/pressure_morpheus/translation.json,
             results/calibration/motility_morpheus/translation.json]
seed_start: 4000                   # fresh seeds: 0 to 19 were Gate 3's, 2000 and up the follow-up's, 3000 and up calibration's
claims_from: ../../examples/suite/drug_pulse.audit.yaml
metrics:
  - metric: last(live)
    budget: {relative: 0.25}
    note: "a quarter of the surviving population"
  - metric: last(drug_mean)
    budget: 0.05
    note: "the suite's clearance threshold, 5% of the pulse"
