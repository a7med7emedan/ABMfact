# Audit of the monolayer example in the reference engine.
# Run:  abmfact run examples/ir/audit_monolayer.yaml --out results/monolayer-audit   (about 3 min on 12 cores)
#       abmfact converge examples/ir/audit_monolayer.yaml
title: "Monolayer with contact inhibition (reference engine)"

model:
  adapter: engine
  engine: reference
  model: monolayer.yaml          # outputs are the model's observables: time, cells, spread

params:
  experiment.max_time: 1440      # one day, to keep the audit quick

claims:
  - id: C1
    statement: "the colony more than doubles in a day"
    metric: last(cells)
    test: greater_than
    value: 80
    skip_checks:
      population_scale: "the cell count is extensive and doubles with the domain"
  - id: C2
    statement: "weaker contact inhibition gives a larger colony"
    metric: last(cells)
    test: monotone_increasing
    over: rules[0].half_max
    where: {"rules[0].half_max": [0.25, 0.5]}
    skip_checks:
      population_scale: "the cell count is extensive and doubles with the domain"

budget:
  seeds: 20
  jobs: 4
