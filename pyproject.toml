[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "abmfact"
version = "0.2.0.dev0"
description = "Is it a finding or an artefact? Audits the conclusions of agent-based models against implementation artefacts."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Ahmed Hemedan" }]
keywords = [
  "agent-based-model", "agent-based-modelling", "abm", "simulation", "verification", "validation",
  "reproducibility", "robustness", "artefacts", "metamorphic-testing", "mesa", "netlogo",
  "computational-science", "research-software",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pyyaml>=6.0",
  "pydantic>=2.6",
]

[project.optional-dependencies]
mesa = ["mesa>=3.1", "networkx>=3.0"]
netlogo = ["pynetlogo>=0.5"]
store = ["pyarrow>=15", "duckdb>=1.0", "zarr>=3.0", "xarray>=2024.1"]
physicell = ["pcdl>=3.3"]
all = ["abmfact[mesa,store,physicell]"]

[project.urls]
Homepage = "https://github.com/a7med7emedan/ABMfact"
Source = "https://github.com/a7med7emedan/ABMfact"
Documentation = "https://github.com/a7med7emedan/ABMfact/tree/main/docs"
Issues = "https://github.com/a7med7emedan/ABMfact/issues"
Changelog = "https://github.com/a7med7emedan/ABMfact/blob/main/CHANGELOG.md"

[project.scripts]
abmfact = "abmfact.cli:main"

[project.entry-points."abmfact.engines"]
python = "abmfact.engines.legacy:PythonEngine"
mesa = "abmfact.engines.legacy:MesaEngine"
netlogo = "abmfact.engines.legacy:NetLogoEngine"
command = "abmfact.engines.legacy:CommandEngine"
reference = "abmfact.engines.reference:ReferenceEngine"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "jsonschema>=4",
  "build>=1.2",
  "twine>=5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/abmfact"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "docs", "assets", "schemas", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: the full planted-fault matrix (deselect with -m 'not slow')"]

[tool.coverage.run]
source = ["abmfact"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "pragma: no cover"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "BLE"]
ignore = ["S101", "RUF001", "RUF002", "RUF003", "S311", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B017"]
"examples/*" = ["S"]
"src/abmfact/zoo.py" = ["SIM108"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
