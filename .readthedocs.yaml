# Read the Docs: the HTML manual and the PDF, built from docs/ with the [docs] extra.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

formats:
  - pdf

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
