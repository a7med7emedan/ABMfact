# Files copied unchanged from PhysiCell stay byte-identical to the originals.
exclude: ^(tests/fixtures/physicell/|tests/fixtures/compucell3d/|tests/fixtures/morpheus/|src/abmfact/engines/physicell/template/)
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
